<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Excel avanzato – Edizione 2026</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>Excel avanzato – Edizione 2026 con IA e automazione</h1>
  <p>Presentazione del libro</p>
</header>

<main>
  <div id="md-content">
    Caricamento in corso...
  </div>
</main>

<footer>
  <p>© 2025 Amedeo De Luca – Tutti i diritti riservati</p>
</footer>

<!-- Libreria Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
  fetch('excel2026.md')
    .then(response => response.text())
    .then(text => {
      document.getElementById('md-content').innerHTML = marked.parse(text);
    })
    .catch(error => {
      document.getElementById('md-content').innerHTML = 'Errore nel caricamento del contenuto.';
      console.error(error);
    });
</script>

</body>
</html>
